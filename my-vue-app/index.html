<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="apple-touch-icon" sizes="180x180" href="src/ico/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="src/ico/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="src/ico/favicon-16x16.png">
  <link rel="manifest" href="src/ico/site.webmanifest">
  <link rel="shortcut icon" href="src/ico/favicon.ico" type="image/x-icon">
  <title>Liberty Car</title>
  <style>
    #preloader {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 1rem;
      padding: 1.5rem;
      background: #0c1424;
      color: #fff;
      font: 600 1rem/1.5 system-ui, sans-serif;
      text-align: center;
    }

    #preloader-logo {
      display: block;
      width: min(12rem, 60vw);
      height: auto;
    }

    #preloader-message {
      font: inherit;
    }

    #preloader-bar {
      width: min(14rem, 70vw);
      height: 0.375rem;
      overflow: hidden;
      border-radius: 999px;
      background: #344766;
    }

    #preloader-bar::before {
      display: block;
      width: 45%;
      height: 100%;
      border-radius: inherit;
      background: #60a5fa;
      content: "";
      animation: preloader-slide 1.2s ease-in-out infinite;
    }

    @keyframes preloader-slide {
      from { transform: translateX(-100%); }
      to { transform: translateX(225%); }
    }

    @media (prefers-reduced-motion: reduce) {
      #preloader-bar::before { animation: none; }
    }
  </style>
  <noscript>
    <style>#preloader-bar, #preloader-message { display: none; }</style>
  </noscript>
</head>

<body>
  <div id="preloader" role="status">
    <img id="preloader-logo" src="./src/assets/LOGO-VETORIZADA.png" alt="Liberty Car" width="1986" height="848" fetchpriority="high" />
    <span id="preloader-message">Carregando Liberty Car…</span>
    <div id="preloader-bar" aria-hidden="true"></div>
    <noscript>Ative o JavaScript para acessar o site.</noscript>
  </div>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18340625424"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'AW-18340625424');
  </script>
  <div id="root"></div>
  <script>
    const theme = localStorage.getItem('theme') || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.classList.add(theme);
  </script>
  <script type="module" src="/src/bootstrap.js"></script>
  <!-- Conversão: clique no botão do WhatsApp -->
  <script>
    document.addEventListener('click', function(event) {
      if (!event.target.closest('a[href*="wa.me"], a[href*="api.whatsapp.com"]')) return;

      gtag('event', 'conversion', {
        'send_to': 'AW-18340625424/XvGvCM3Up9QcEJD4vqlE',
        'value': 1.0,
        'currency': 'BRL'
      });
    });
  </script>
</body>

</html>
